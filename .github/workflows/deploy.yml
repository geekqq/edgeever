name: Deploy EdgeEver

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apps/site/**"
      - "apps/mobile/**"
      - ".github/workflows/deploy-site.yml"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeever-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EDGE_EVER_WORKER_NAME: ${{ secrets.EDGE_EVER_WORKER_NAME }}
      EDGE_EVER_CUSTOM_DOMAIN: ${{ secrets.EDGE_EVER_CUSTOM_DOMAIN }}
      EDGE_EVER_D1_DATABASE_NAME: ${{ secrets.EDGE_EVER_D1_DATABASE_NAME }}
      EDGE_EVER_D1_DATABASE_ID: ${{ secrets.EDGE_EVER_D1_DATABASE_ID }}
      EDGE_EVER_R2_BUCKET_NAME: ${{ secrets.EDGE_EVER_R2_BUCKET_NAME }}
      EDGE_EVER_R2_PREVIEW_BUCKET_NAME: ${{ secrets.EDGE_EVER_R2_PREVIEW_BUCKET_NAME }}
      EDGE_EVER_AUTH_USERNAME: ${{ secrets.EDGE_EVER_AUTH_USERNAME }}
      EDGE_EVER_AUTH_PASSWORD_HASH: ${{ secrets.EDGE_EVER_AUTH_PASSWORD_HASH }}
      EDGE_EVER_SESSION_TTL_DAYS: ${{ secrets.EDGE_EVER_SESSION_TTL_DAYS }}
      EDGE_EVER_WORKERS_DEV: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build web app
        run: bun run build

      - name: Deploy instance
        run: bun run deploy:worker

      - name: Sync auth secret
        run: |
          printf '%s' "$EDGE_EVER_AUTH_PASSWORD_HASH" \
            | bun scripts/run-wrangler.mjs secret put EDGE_EVER_AUTH_PASSWORD_HASH
