name: Sync fork with upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Sync fork main branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/tianma-if/edgeever.git
          git fetch upstream main
          git checkout main

          git merge --no-commit --no-ff upstream/main || true

          # Keep the fork's own workflow files so the GitHub App token does not
          # need workflow-write permission, and so fork-specific deploy jobs stay intact.
          git restore --source=HEAD --staged --worktree .github/workflows

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain:'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'Already up to date.'
            exit 0
          fi

          git commit --no-edit
          git push origin main
