name: Sync fork with upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Sync fork main branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/tianma-if/edgeever.git
          git fetch upstream main
          git checkout main

          git merge --no-commit --allow-unrelated-histories upstream/main || true

          # Keep the fork's own workflow files. Resolve every conflict inside
          # .github/workflows in favor of the fork (HEAD), including modify/delete
          # conflicts where the fork deleted a file that upstream modified.
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if git cat-file -e ":2:${path}" 2>/dev/null; then
              git checkout --ours -- "$path"
              git add -- "$path"
            else
              git rm -f -- "$path"
            fi
          done < <(git diff --name-only --diff-filter=U -- .github/workflows)

          # Normalize the whole workflow directory back to the fork's version, so the
          # push stays within the default token's contents:write permission, which
          # cannot create or update workflow files.
          git restore --source=HEAD --staged --worktree .github/workflows

          # Any conflict outside .github/workflows needs a human.
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain:'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'Already up to date.'
            exit 0
          fi

          git commit --no-edit
          git push origin main
